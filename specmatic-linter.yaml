rules:
  rule/parameter-description-required:
    severity: error
    type: parameters
    maturity: bronze
    on:
      type: Parameter
    must:
      required:
        - description
    message: "Platform standard: Every parameter must have a description."

  rule/security-scheme-modern:
    severity: error
    type: security
    maturity: silver
    on:
      type: SecurityScheme
      property: type
    must:
      enum:
        - oauth2
        - openIdConnect
    message: "Platform standard: Only OAuth2 or OpenID Connect security schemes are allowed."

  rule/no-legacy-version-header:
    severity: warn
    type: parameters
    on:
      type: Parameter
      property: name
    must:
      pattern: "^(?!X-API-Version$).*$"
    message: "Platform standard: Avoid the legacy X-API-Version header."

profiles:
  default:
    rules:
      extends:
        - recommended

  public-api:
    rules:
      extends:
        - recommended
      include:
        - rule/parameter-description-required
        - rule/security-scheme-modern
        - info-license
        - info-contact
        - operation-summary
      override:
        security-defined: error
        operation-4xx-response: error
        operation-tag-defined: warn

  internal-api:
    extends:
      - default
    rules:
      include:
        - rule/parameter-description-required
        - rule/no-legacy-version-header
      exclude:
        - info-contact
        - info-license
      override:
        operation-summary: warn
        security-defined:
          severity: warn
        operation-4xx-response: warn
        parameter-description: error

  payment-api:
    extends:
      - public-api
    rules:
      override:
        security-defined:
          severity: error
          type: security
          maturity: gold
        operation-4xx-problem-details-rfc7807:
          severity: error
          type: operations
          maturity: gold
        rule/security-scheme-modern:
          severity: error
          type: security
          maturity: gold
          on:
            type: SecurityScheme
            property: type
          must:
            enum:
              - oauth2
              - openIdConnect
          message: "Platform standard: Only OAuth2 or OpenID Connect security schemes are allowed."
